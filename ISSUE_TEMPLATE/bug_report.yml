name: Bug report
description: Something behaves differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Not for vulnerabilities.** If this is a security issue, close this form and
        follow [SECURITY.md](https://github.com/Tunedness/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
      placeholder: |
        Expected: the request is proxied to the provider.
        Got: 502, and the log line below.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it. A request, a config, a file.
      placeholder: |
        1. docker compose up -d
        2. create a connection with provider=ollama
        3. POST /v1/chat/completions with …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, container tag, or commit SHA.
      placeholder: v0.1.0 / ghcr.io/… / 9f3c1ab
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - Docker, hand-rolled
        - Built from a clone
        - Released binary or package
        - Something else, described below
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, and the runtime version if you built it yourself.
      placeholder: |
        Ubuntu 24.04, x86_64
        Docker 27.3, Node 22.9 / Go 1.23
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: "The part that matters, with secrets removed. Env vars, the policy file, the connection settings."
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines around the failure. Paste text, not a screenshot of text.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for this.
          required: true
        - label: I read the relevant part of the README or docs.
          required: true
        - label: This is not a security vulnerability.
          required: true
